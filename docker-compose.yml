services:
  postgres:
    # Keep the image major version aligned with the existing postgres_data
    # volume. PostgreSQL data directories cannot be opened by a different major.
    image: postgres:15-alpine
    container_name: srv_admin_postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - log_min_duration_statement=1000
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_DATABASE:-srv_admin}
    ports:
      # Database administration is host-local. Remote access should use SSH.
      - '127.0.0.1:5433:5432'
    shm_size: 256mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/upadted.sql:/docker-entrypoint-initdb.d/01-upadted.sql:ro
      - ./docker/postgres/02-drop-prisma-metadata.sql:/docker-entrypoint-initdb.d/02-drop-prisma-metadata.sql:ro
      - ./docker/postgres/03-create-current-tables.sql:/docker-entrypoint-initdb.d/03-create-current-tables.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-srv_admin}']
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: srv_admin_pgadmin
    restart: unless-stopped
    ports:
      - '127.0.0.1:5050:8080'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'True'
      PGADMIN_CONFIG_MAX_LOGIN_ATTEMPTS: '5'
      PGADMIN_CONFIG_SESSION_EXPIRATION_TIME: '30'
      PGADMIN_CONFIG_LOGIN_BANNER: "'Authorized database administrators only'"
      PGADMIN_DISABLE_POSTFIX: '1'
      PGADMIN_LISTEN_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g

  backend:
    build: .
    container_name: srv_admin_backend
    restart: unless-stopped
    init: true
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      APP_ENV: development
      RUNNING_IN_DOCKER: 'true'
      HOST: 0.0.0.0
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_DATABASE: ${DB_DATABASE:-srv_admin}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
      DB_LOGGING: ${DB_LOGGING:-false}
      DB_SSL: ${DB_SSL:-false}
      DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8081,http://127.0.0.1:8081}
      CORS_CREDENTIALS: ${CORS_CREDENTIALS:-true}
      API_PREFIX: ${API_PREFIX:-api/v1}
      BODY_LIMIT: ${BODY_LIMIT:-10mb}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20

  admin-frontend:
    build:
      context: ../srv-new-adminpanel
      dockerfile: ../srv-new-app-backend/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3001/api/v1}
        SERVER_API_URL: ${SERVER_API_URL:-http://backend:3001/api/v1}
    container_name: srv_admin_frontend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:3001/api/v1}
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:3001/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:3000'
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /app/.next/cache:size=256m,uid=1000,gid=1000,mode=1770
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

  mobile-app:
    build:
      context: ../srv-new-app-frontend
      dockerfile: ../srv-new-app-backend/docker/expo-app.Dockerfile
    container_name: srv_mobile_app
    restart: unless-stopped
    environment:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: localhost
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://127.0.0.1:3001/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '8081:8081'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8081').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 20

volumes:
  postgres_data:
  pgadmin_data:
